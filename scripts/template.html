<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>BCS Outbound Board</title>
<style>
  :root{--bg:#161041;--panel:#211a5c;--line:#2f2775;--ink:#fff;--mute:#a9a3d6;
        --pink:#ED1F82;--purple:#6B4FA0;--teal:#00B7D1;--yellow:#FDE14B;
        --good:#3DDC84;--warn:#FDE14B;--bad:#FF4D5E}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;padding:6.2vh 2.4vw 2.2vh;gap:1.6vh}
  .slide.active{display:flex}
  header{display:flex;align-items:baseline;justify-content:space-between}
  h1{font-size:3.6vh;font-weight:800;letter-spacing:.02em}
  h1 span{color:var(--pink)}
  .meta{font-size:2vh;color:var(--mute)}
  .meta b{color:var(--teal);font-weight:700}
  .grid,.row{display:grid;grid-template-columns:12% 30% 9.5% 9.5% 9.5% 10% 9.5% 10%;align-items:center}
  .head{font-size:1.7vh;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;padding:0 1.4vw}
  .head div:not(:first-child){text-align:center}
  .rows{flex:1;display:flex;flex-direction:column;gap:1.2vh}
  .row{flex:1;background:var(--panel);border-radius:1.4vh;padding:0 1.4vw;border-left:.6vh solid var(--purple)}
  .name{font-size:3.4vh;font-weight:700;line-height:1.1}
  .dials{display:flex;align-items:center;gap:1.4vw;height:100%;padding:1.2vh 0}
  .bars{flex:1;display:flex;gap:.6vw;height:100%;align-items:flex-end}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar i{display:block;width:100%;min-height:.4vh;background:var(--purple);border-radius:.5vh .5vh 0 0}
  .bar.today i{background:var(--pink)}
  .bar.future i{background:transparent}
  .bar .v{font-size:2vh;font-weight:700;margin-bottom:.3vh}
  .bar .d{white-space:nowrap;font-size:1.4vh;color:var(--mute);margin-top:.4vh}
  .bar.today .d{color:var(--pink);font-weight:700}
  .total,.metric{text-align:center;display:flex;flex-direction:column;align-items:center}
  .total{min-width:9vw;padding:.8vh .8vw;border-radius:1vh}
  .row b{font-size:5.6vh;font-weight:800;line-height:1}
  .row .total b{font-size:6vh}
  small{font-size:1.6vh;color:var(--mute);margin-top:.6vh}
  .good b{color:var(--good)} .warn b{color:var(--warn)} .bad b{color:var(--bad)}
  .totals{background:transparent;border:.25vh solid var(--line);border-left:.6vh solid var(--teal);flex:0 0 9vh}
  .totals .name{font-size:2.6vh;color:var(--teal)}
  .row.totals b{font-size:4vh}
  .head .hpipe{color:var(--pink)} .head .hinb{color:var(--teal)}
  .row .pipe{border-left:.2vh solid var(--line);height:70%;justify-content:center}
  .row .inb b{color:var(--teal)}
  .name{font-size:3vh}
  footer{font-size:1.5vh;color:var(--mute);display:flex;justify-content:space-between}
  /* rotation chrome */
  #nav{position:fixed;top:1.4vh;left:2.4vw;display:flex;gap:.5vw;z-index:5}
  #nav span{font-size:1.5vh;color:var(--mute);padding:.4vh .8vw;border-radius:2vh;border:.15vh solid var(--line);letter-spacing:.05em}
  #nav span.on{color:var(--ink);background:var(--pink);border-color:var(--pink);font-weight:700}
  #prog{position:fixed;top:0;left:0;height:.5vh;background:var(--teal);width:0;z-index:5}
  /* pipeline slides */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
  .kpi{background:var(--panel);border-radius:1.4vh;padding:1.6vh 1.4vw;display:flex;flex-direction:column}
  .kpi b{font-size:5.4vh;font-weight:800;line-height:1}
  .kpi small{font-size:1.8vh}
  .stages{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.8fr);gap:.9vw;min-height:0}
  .col{min-width:0;display:flex;flex-direction:column;min-height:0;gap:.9vh}
  .ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2vh .6vw;padding:0 .4vw .6vh;border-bottom:.3vh solid var(--purple)}
  .ch span{flex-basis:100%;font-size:1.7vh;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
  .ch b{font-size:3vh;font-weight:800}
  .ch small{margin:0;font-size:1.9vh;color:var(--teal);font-weight:700}
  .col.delayed{opacity:.55}
  .cards{display:flex;flex-direction:column;gap:.8vh;min-height:0;overflow:hidden}
  .card{background:var(--panel);border-radius:1vh;padding:1vh .8vw;border-left:.5vh solid var(--purple)}
  .card.due{border-left-color:var(--bad)} .card.quiet{border-left-color:var(--warn)}
  .dn{font-size:2vh;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dm{display:flex;align-items:baseline;gap:.6vw;margin-top:.4vh;flex-wrap:wrap}
  .dm b{font-size:2.3vh;font-weight:800}
  .dm span{font-size:1.6vh;color:var(--mute)}
  em{font-style:normal;font-size:1.4vh;font-weight:700;padding:.15vh .5vw;border-radius:.6vh}
  .f-bad{background:var(--bad);color:#fff} .f-warn{background:var(--warn);color:#161041} .f-exp{background:var(--teal);color:#161041}
  .more,.none{font-size:1.7vh;color:var(--mute);padding:.4vh .4vw}
  .kpi.bad b{color:var(--bad)} .kpi.good b{color:var(--good)}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
  .empty b{font-size:7vh;font-weight:800}
  .empty small{font-size:2.6vh}
  #stale{display:none;position:fixed;inset:auto 0 0 0;background:var(--bad);color:#fff;
    text-align:center;font-size:2.2vh;font-weight:700;padding:1vh}
</style>
</head>
<body>
<div id="prog"></div><div id="nav"></div>
{{SLIDES}}
<div id="stale">Board data is more than 45 minutes old — check the GitHub Action</div>
<script>
  (function(){var gen={{GEN}}*1000,now=new Date(),age=(now-gen)/60000;
   var mt=new Date(now.toLocaleString("en-US",{timeZone:"America/Denver"}));
   var biz=mt.getDay()>=1&&mt.getDay()<=5&&mt.getHours()>=8&&mt.getHours()<18;
   if(biz&&age>45)document.getElementById("stale").style.display="block";})();
</script>
<script>
(function(){
  var S=[].slice.call(document.querySelectorAll(".slide")),nav=document.getElementById("nav"),
      prog=document.getElementById("prog"),loaded=Date.now(),i=0,timer=null,paused=false;
  S.forEach(function(s,k){var e=document.createElement("span");e.textContent=s.dataset.label;nav.appendChild(e);});
  var dots=[].slice.call(nav.children);
  // #rick pins one page (no rotation); #board pins the outbound board
  var pin=(location.hash||"").slice(1).toLowerCase();
  function show(n){
    i=(n+S.length)%S.length;
    S.forEach(function(s,k){s.classList.toggle("active",k===i);});
    dots.forEach(function(d,k){d.classList.toggle("on",k===i);});
    var dur=(+S[i].dataset.dur||15)*1000;
    prog.style.transition="none";prog.style.width="0";void prog.offsetWidth;
    if(paused||pin){return;}
    prog.style.transition="width "+dur+"ms linear";prog.style.width="100%";
    clearTimeout(timer);
    timer=setTimeout(function(){
      // pick up fresh data at the end of a cycle once the page is >5 min old
      if(i===S.length-1&&Date.now()-loaded>300000){location.reload();return;}
      show(i+1);},dur);
  }
  var start=0;S.forEach(function(s,k){if(pin&&s.dataset.key===pin)start=k;});
  if(pin){setTimeout(function(){location.reload();},300000);}
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){show(i+1);} else if(e.key==="ArrowLeft"){show(i-1);}
    else if(e.key===" "){paused=!paused;clearTimeout(timer);show(i);}
  });
  show(start);
})();
</script>
</body>
</html>
