name: Keepalive
# GitHub disables scheduled workflows after 60 days without repo activity.
on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "outbound-board-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u > .keepalive
          git add .keepalive
          git commit -m "keepalive [skip ci]"
          git push
